<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg [
  <!ENTITY xxe "BANG">
  <!ENTITY boom "&xxe;&xxe;">
]>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="400" height="110"
     onload="alert('event handler triggered')">

  <!-- Event handler -->
  <circle cx="50" cy="50" r="40" onclick="console.log('clicked!')" />

  <!-- External link -->
  <image xlink:href="http://malicious.site/evil.png" width="100" height="100"/>

  <!-- Base64-encoded payload -->
  <image href="data:image/svg+xml;base64,PHN2ZyBvbmxvYWQ9YWxlcnQoJ2Z1Y2snKTs+PC9zdmc+" width="100" height="100"/>

  <!-- ForeignObject HTML injection -->
  <foreignObject width="100" height="100">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <script>alert('Injected HTML JS')</script>
    </body>
  </foreignObject>

  <!-- Obfuscated JavaScript -->
  <script>
    var y = "\u0061\u006c\u0065\u0072\u0074";  // alert
    eval(y);
  </script>

  <!-- CSS import / remote resource -->
  <style>
    @import url("http://malwarecdn.net/style.css");
    .phish { background-image: url("http://cdn.bad/track.png"); }
  </style>

  <!-- XML Entity Expansion in Text -->
  <text y="95">&boom;</text>

</svg>